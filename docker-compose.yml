services:
  postgres:
    image: postgres:17
    container_name: knowledge-nexus
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio-community:local
    container_name: knowledge-nexus-minio
    command: server /data  --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data

  nats:
    image: nats:2.15.0-alpine
    container_name: knowledge-nexus-nats
    command: ["-js", "-sd", "/data", "-m","8222"]
    ports:
      - "127.0.0.1:${NATS_PORT}:4222"
      - "127.0.0.1:${NATS_HTTP_PORT}:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  nats_data: